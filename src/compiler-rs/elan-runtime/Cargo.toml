# Self-contained (no workspace inheritance): installed in
# share/elan-rs/elan-runtime, where the generated crates use it by path.
[package]
name = "elan-runtime"
description = "Runtime library of the programs generated by elanc-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "GPL-2.0-or-later"
